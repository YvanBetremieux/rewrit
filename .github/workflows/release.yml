name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Stable self-signed identity: macOS keeps the Accessibility permission across updates
      - name: Import signing identity (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/rewrit.keychain-db"
          KP=$(openssl rand -base64 24)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rewrit.p12"
          security import "$RUNNER_TEMP/rewrit.p12" -k "$KC" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/rewrit.p12" -nokeys -passin pass:"$CERT_P12_PASSWORD" | /usr/bin/openssl x509 -out "$RUNNER_TEMP/rewrit.pem"
          rm -f "$RUNNER_TEMP/rewrit.p12"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/rewrit.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -q '"rewrit Self-Signed"'
          echo "APPLE_SIGNING_IDENTITY=rewrit Self-Signed" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'rewrit v__VERSION__'
          releaseBody: |
            ## rewrit v__VERSION__

            AI-powered instant text transformation — L'IA au bout de tes doigts.

            ### What's new
            - Multi-provider support: Groq, Mistral, Gemini, Ollama (local)
            - BYOK (Bring Your Own Key) per provider
            - Streaming with progress bar
            - Configurable Quick Select shortcut
            - All settings persisted between sessions

            ### Download
            - **macOS Apple Silicon**: `rewrit_*_aarch64.dmg`
            - **macOS Intel**: `rewrit_*_x64.dmg`
            - **Windows**: `rewrit_*_x64-setup.exe`
            - **Linux**: `rewrit_*_amd64.deb` / `rewrit_*_amd64.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Check macOS signature
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(ls -d src-tauri/target/*/release/bundle/macos/rewrit.app)
          SIG="$(codesign -dv --verbose=2 "$APP" 2>&1)"
          echo "$SIG"
          [[ "$SIG" == *"Authority=rewrit Self-Signed"* ]]

      - name: Delete the keychain
        if: always() && matrix.platform == 'macos-latest'
        run: security delete-keychain "$RUNNER_TEMP/rewrit.keychain-db" 2>/dev/null || true
