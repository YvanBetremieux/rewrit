<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rewrit - Documentation</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --sidebar-bg: #161922;
      --card-bg: #1c1f2e;
      --border: #2a2d3e;
      --text: #e2e8f0;
      --text-muted: #8892a8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --link: #818cf8;
      --code-bg: #12141d;
      --heading: #f1f5f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: -0.5px;
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .nav-section {
      margin-bottom: 16px;
    }

    .nav-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 4px 10px;
      margin-bottom: 4px;
    }

    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .nav-item:hover {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-hover);
    }

    .nav-item.active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-hover);
      font-weight: 600;
    }

    .nav-item .nav-desc {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
    }

    /* --- Content --- */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
    }

    .content .markdown {
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.75;
    }

    /* --- Markdown styles --- */
    .markdown h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--heading);
      margin: 0 0 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .markdown h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--heading);
      margin: 40px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .markdown h3 {
      font-size: 17px;
      font-weight: 600;
      color: var(--heading);
      margin: 28px 0 12px;
    }

    .markdown h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 20px 0 8px;
    }

    .markdown p {
      margin: 12px 0;
    }

    .markdown a {
      color: var(--link);
      text-decoration: none;
    }

    .markdown a:hover {
      text-decoration: underline;
    }

    .markdown ul, .markdown ol {
      margin: 12px 0;
      padding-left: 24px;
    }

    .markdown li {
      margin: 4px 0;
    }

    .markdown code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 16px 0;
    }

    .markdown pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #c9d1d9;
    }

    .markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }

    .markdown th {
      text-align: left;
      font-weight: 600;
      color: var(--heading);
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
      background: var(--code-bg);
    }

    .markdown td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .markdown tr:hover td {
      background: rgba(99, 102, 241, 0.05);
    }

    .markdown blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 16px 0;
      color: var(--text-muted);
      background: rgba(99, 102, 241, 0.05);
      border-radius: 0 6px 6px 0;
    }

    .markdown hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .markdown strong {
      color: var(--heading);
      font-weight: 600;
    }

    /* --- Loading / Welcome --- */
    .welcome {
      text-align: center;
      padding-top: 120px;
      color: var(--text-muted);
    }

    .welcome h2 {
      font-size: 24px;
      color: var(--heading);
      margin-bottom: 12px;
      border: none;
    }

    .welcome p {
      font-size: 15px;
    }

    .welcome kbd {
      display: inline-block;
      font-family: monospace;
      font-size: 12px;
      padding: 2px 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* --- TOC in content --- */
    .toc {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }

    .toc-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .toc a {
      display: block;
      font-size: 13px;
      color: var(--link);
      text-decoration: none;
      padding: 3px 0;
    }

    .toc a:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <h1>rewrit</h1>
      <p>Documentation</p>
    </div>
    <div class="nav" id="nav"></div>
  </nav>

  <main class="content" id="content">
    <div class="welcome">
      <h2>rewrit docs</h2>
      <p>Choisissez un document dans le menu.</p>
    </div>
  </main>

  <script>
    const docs = [
      {
        section: "Architecture",
        items: [
          { file: "ARCHITECTURE.md", title: "Architecture technique", desc: "Threads, flows, diagrammes" },
        ]
      },
      {
        section: "Guides",
        items: [
          { file: "QUICK_START_FR.md", title: "Quick Start", desc: "Demarrage en 30 secondes" },
          { file: "CHEAT_SHEET.md", title: "Cheat Sheet", desc: "Commandes et raccourcis" },
          { file: "SETUP.md", title: "Setup", desc: "Prerequis et installation" },
        ]
      },
      {
        section: "Reference",
        items: [
          { file: "FEATURE_FLAGS.md", title: "Configuration", desc: "Groq, backend, settings" },
          { file: "IMPLEMENTATION_SUMMARY.md", title: "Implementation", desc: "Details techniques" },
          { file: "MIGRATION_NOTES.md", title: "Migration Notes", desc: "Problemes resolus" },
          { file: "NOUVELLES_FONCTIONNALITES.md", title: "Nouveautes", desc: "Fonctionnalites ajoutees" },
        ]
      },
      {
        section: "Projet",
        items: [
          { file: "INDEX.md", title: "Index", desc: "Table des matieres" },
          { file: "../README.md", title: "README", desc: "Documentation principale" },
          { file: "../DoD.md", title: "DoD", desc: "Specifications (FR)" },
          { file: "../CLAUDE.md", title: "CLAUDE.md", desc: "Contexte pour Claude" },
        ]
      },
    ];

    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    let activeBtn = null;

    // Build navigation
    docs.forEach(section => {
      const div = document.createElement("div");
      div.className = "nav-section";
      div.innerHTML = `<div class="nav-section-title">${section.section}</div>`;
      section.items.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "nav-item";
        btn.innerHTML = `${item.title}<span class="nav-desc">${item.desc}</span>`;
        btn.addEventListener("click", () => loadDoc(item.file, btn));
        div.appendChild(btn);
      });
      nav.appendChild(div);
    });

    async function loadDoc(file, btn) {
      if (activeBtn) activeBtn.classList.remove("active");
      btn.classList.add("active");
      activeBtn = btn;

      content.innerHTML = '<div class="welcome"><p>Chargement...</p></div>';

      try {
        const resp = await fetch(file);
        if (!resp.ok) throw new Error(`${resp.status}`);
        const md = await resp.text();
        const html = marked.parse(md);
        content.innerHTML = `<div class="markdown">${html}</div>`;
        content.scrollTop = 0;
      } catch (e) {
        content.innerHTML = `<div class="welcome"><h2>Erreur</h2><p>Impossible de charger <kbd>${file}</kbd></p><p style="margin-top:8px;font-size:13px;">Lancez un serveur local depuis <kbd>docs/</kbd> :<br><code>python3 -m http.server 8080</code></p></div>`;
      }
    }

    // Load from hash on page load
    if (location.hash) {
      const file = decodeURIComponent(location.hash.slice(1));
      const allItems = docs.flatMap(s => s.items);
      const match = allItems.find(i => i.file === file);
      if (match) {
        const btns = nav.querySelectorAll(".nav-item");
        const idx = allItems.indexOf(match);
        loadDoc(match.file, btns[idx]);
      }
    }
  </script>
</body>
</html>
