name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'rewrit v__VERSION__'
          releaseBody: |
            ## rewrit v__VERSION__

            AI-powered instant text transformation — L'IA au bout de tes doigts.

            ### What's new
            - Multi-provider support: Groq, Mistral, Gemini, Ollama (local)
            - BYOK (Bring Your Own Key) per provider
            - Streaming with progress bar
            - Configurable Quick Select shortcut
            - All settings persisted between sessions

            ### Download
            - **macOS Apple Silicon**: `rewrit_*_aarch64.dmg`
            - **macOS Intel**: `rewrit_*_x64.dmg`
            - **Windows**: `rewrit_*_x64-setup.exe`
            - **Linux**: `rewrit_*_amd64.deb` / `rewrit_*_amd64.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
